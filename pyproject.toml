[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galbook"
version = "1.2.5"
description = "Let AI agents play visual novels like humans: choices, saves, rewinds, many agents at once. HTTP text API, MCP, OpenAI tools."
readme = "README.en.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
keywords = ["visual-novel", "galgame", "agent", "llm", "mcp", "renpy", "kirikiri"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Games/Entertainment"]

[project.scripts]
galbook = "galbook.__main__:main"

[tool.setuptools]
packages = ["galbook", "galbook.importers"]

[tool.setuptools.package-data]
galbook = ["static/*", "demo/*/*.gal", "demo/*/assets/*"]
