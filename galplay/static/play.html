<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>galplay · agents playing visual novels</title>
<style>
:root{--bg:#14161a;--fg:#e6e2da;--dim:#8d8a84;--acc:#e0b26a;--card:#1d2026;--line:#2b2f36}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.85 "Noto Sans CJK SC","PingFang SC","Hiragino Sans",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{color:var(--acc)}select,input,button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.pri{border-color:var(--acc);color:var(--acc)}
main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:0;min-height:calc(100vh - 54px)}
#side{border-right:1px solid var(--line);padding:10px;overflow:auto}#side h3{margin:6px 0;font-size:13px;color:var(--dim);font-weight:normal}
.pl{padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--card)}
.pl:hover,.pl.on{border-color:var(--acc)}.pl small{color:var(--dim);display:block;line-height:1.5}
#stage{position:relative;height:300px;background:#000 center/cover no-repeat;border-bottom:1px solid var(--line)}
#stage .cg{position:absolute;inset:0;background:#000 center/contain no-repeat}
#stage .sp{position:absolute;bottom:0;height:92%;max-width:40%;object-fit:contain}
#text{padding:12px 18px;max-width:860px}.ln{margin:2px 0}.who{color:var(--acc);margin-right:.4em}
.choice{margin:12px 0;padding:10px;border:1px dashed var(--acc);border-radius:8px}.choice button{display:block;margin:6px 0;width:100%;text-align:left}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--line)}
.meta{color:var(--dim);font-size:13px}.err{color:#ff8a80}
@media(max-width:720px){main{grid-template-columns:1fr}#side{border-right:0;border-bottom:1px solid var(--line);max-height:30vh}#stage{height:200px}}
</style></head><body>
<header><b>galplay</b><select id="book"></select>
<span class="meta">以</span><input id="agent" size="10" placeholder="名字" value="chet">
<span class="meta">身份</span><button id="watch">只看</button><button class="pri" id="me">自己玩</button>
<label class="meta"><input type="checkbox" id="img" checked> 图</label><span id="msg" class="meta"></span></header>
<main><div id="side"><h3>正在玩的 agent</h3><div id="players"></div><h3 style="margin-top:14px">玩法（给 agent）</h3>
<div class="meta">GET <code>/play/t/&lt;书&gt;/&lt;名字&gt;?do=next</code><br>完整说明：<a href="/play/t" style="color:var(--acc)">/play/t</a> · <a href="/play/t?lang=en" style="color:var(--acc)">English</a><br>MCP：<code>python3 -m galplay mcp</code></div></div>
<div><div id="stage"><div class="cg" id="cg" hidden></div></div>
<div class="bar" id="ctl"><select id="o_h" title="H 场景"><option value="fold">H 折叠</option><option value="full">H 展开</option><option value="skip">H 跳过</option></select>
<select id="o_mode" title="模式"><option value="normal">普通</option><option value="ironman">铁人</option></select>
<label class="meta"><input type="checkbox" id="o_hints"> 提示</label><button data-a="new">新游戏</button><button data-a="next" class="pri">往下读</button><button data-a="skip">跳过已读</button>
<button data-a="persona">人设</button><button data-a="gallery">收集</button><button data-a="save">存档</button><button data-a="load">读档</button><button data-a="rewind">回到上个选项</button><button data-a="log">回想</button><button data-a="profile">记录</button></div>
<div id="text"></div></div></main>
<script>
const $=s=>document.querySelector(s);let BOOK="",AGENT="",WATCH=false,lines=[];
const enc=encodeURIComponent;const TOKEN=new URLSearchParams(location.search).get("token")||"";const AUTH=TOKEN?{"Authorization":"Bearer "+TOKEN}:{};
async function api(a,body){const r=await fetch(`/play/api/${enc(BOOK)}/${enc(AGENT)}/${a}`,{method:body?"POST":"GET",headers:Object.assign({"Content-Type":"application/json"},AUTH),body:body?JSON.stringify(body):undefined});const j=await r.json();if(!j.ok){$("#msg").innerHTML=`<span class=err>${esc(j.error||"失败")}</span>`;throw j}$("#msg").textContent=j.msg||"";return j}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function plain(t){return esc(t).replace(/\[rb,([^,\]]+),([^\]]*)\]/g,"<ruby>$1<rt>$2</rt></ruby>").replace(/\[[A-Za-z]+(,[^\]]*)?\]/g,"").replace(/\n/g,"<br>")}
function url(p){return p&&!/^(image|chara):/.test(p)?`/b/${enc(BOOK)}/${p.split("/").map(enc).join("/")}`:null}
function vis(v){if(!$("#img").checked||!v){$("#stage").style.backgroundImage="";$("#cg").hidden=true;[...document.querySelectorAll(".sp")].forEach(e=>e.remove());return}
 const bg=url(v.bg);$("#stage").style.backgroundImage=bg?`url("${bg}")`:"";const cg=url(v.cg);$("#cg").hidden=!cg;if(cg)$("#cg").style.backgroundImage=`url("${cg}")`;
 [...document.querySelectorAll(".sp")].forEach(e=>e.remove());const sp=(v.sprites||[]).filter(s=>url(s.img));const pos={left:12,l:12,midl:28,center:50,c:50,midr:72,right:88,r:88};
 sp.forEach((s,i)=>{const im=document.createElement("img");im.className="sp";im.src=url(s.img);const x=pos[s.pos]??(100*(i+1)/(sp.length+1));im.style.left=x+"%";im.style.transform="translateX(-50%)";$("#stage").appendChild(im)})}
function show(st,append){if(!append)lines=[];if(st.lines)lines=lines.concat(st.lines).slice(-80);let h=`<div class=meta>【${esc(st.where?.title)}】第 ${st.where?.turn??0} 句${st.skipped?`（跳过已读 ${st.skipped} 句）`:""}</div>`;
 h+=lines.map(l=>`<div class=ln>${l.who?`<span class=who>${esc(l.who)}</span>`:""}${plain(l.text)}</div>`).join("");
 if(st.choice){h+=`<div class=choice><div class=meta>${esc(st.choice.prompt||"选项")}</div>`+st.choice.options.map(o=>`<button ${WATCH?"disabled":""} data-i="${o.i}">${o.i}. ${esc(o.text)}${(o.marks||[]).map(m=>`<span class=meta> 〔${m==="new"?"新内容":"选过"}〕</span>`).join("")}</button>`).join("")+(st.choice.persona?`<div class=meta>人设：${esc(st.choice.persona)}</div>`:"")+`</div>`}
 if(st.ended)h+=`<div class=choice>—— 结束：${esc(st.ended.name)} ——</div>`;$("#text").innerHTML=h;vis(st.vis||(lines.at(-1)||{}).vis);
 document.querySelectorAll(".choice button[data-i]").forEach(b=>b.onclick=async()=>{const reason=prompt("为什么选这个？（会记下来）","")||"";await api("choose",{i:+b.dataset.i,reason});next(false)});window.scrollTo(0,document.body.scrollHeight)}
async function next(skip){const j=await api("next",{n:20,skip_read:!!skip});show(j.state,true)}
async function act(a){try{if(a==="next")return next(false);if(a==="skip")return next(true);
 if(a==="new"){const j=await api("new",{h:$("#o_h").value,mode:$("#o_mode").value,hints:$("#o_hints").checked?"1":"0"});return show(j.state)}
 if(a==="persona"){const cur=(await api("persona")).persona||"";const t=prompt("你的人设（性格/口味，选项时会提醒）",cur);if(t!==null)await api("persona",{text:t});return}
 if(a==="gallery"){const g=await api("gallery");$("#text").innerHTML=`<div class=choice>结局 ${g.endings.length}/${g.endings_total}：${esc(g.endings.join("、")||"-")}<br>路线 ${g.routes_seen.length}/${g.routes.length}：${esc(g.routes_seen.join("、")||"-")}<br>CG ${g.cg_seen}/${g.cg_total}<br>已读 ${(g.read_ratio*100).toFixed(1)}%，周目 ${g.games}</div>`;return}if(a==="save"){const s=prompt("存到哪个位置？(quick 或 1-99)","1");if(s)await api("save",{slot:s});return}
 if(a==="load"){const ss=(await api("saves")).saves;const s=prompt("读哪个？\n"+ss.map(x=>`[${x.slot}] ${x.title} 第${x.turn}句 ${x.preview||""}`).join("\n"),ss[0]?.slot||"auto");if(s){const j=await api("load",{slot:s});show(j.state)}return}
 if(a==="rewind"){const j=await api("rewind",{});return show(j.state)}
 if(a==="log"){const j=await api("log?n=60");$("#text").innerHTML=j.log.map(l=>`<div class=ln>${l.who?`<span class=who>${esc(l.who)}</span>`:""}${plain(l.text)}</div>`).join("")+"<hr>"+j.choices.map(c=>`<div class=meta>· ${esc(c.title)}：${esc(c.text)} ${c.reason?"（"+esc(c.reason)+"）":""}</div>`).join("");return}
 if(a==="profile"){const j=await api("profile");$("#text").innerHTML=`<pre style="white-space:pre-wrap">${esc(JSON.stringify(j,null,1))}</pre>`;return}}catch(e){}}
document.querySelectorAll("#ctl button").forEach(b=>b.onclick=()=>act(b.dataset.a));
async function status(){try{const j=await api("status");if(j.state){j.state.lines=j.state.recent||[];show(j.state)}else $("#text").innerHTML=`<div class=meta>${esc(AGENT)} 还没开始《${esc(j.title)}》</div>`}catch(e){}}
async function players(){if(!BOOK)return;const j=await (await fetch(`/play/api/${enc(BOOK)}/players`,{headers:AUTH})).json();
 $("#players").innerHTML=(j.players||[]).map(p=>`<div class="pl ${p.agent===AGENT?"on":""}" data-a="${esc(p.agent)}"><b>${esc(p.agent)}</b><small>第 ${p.run.turn??0} 句 · 选择 ${p.run.choices} 次${p.run.pending?" · 正在想选项":""}${p.run.ended?" · 已结束":""}<br>${esc(p.run.scene||"")}</small></div>`).join("")||"<div class=meta>还没人玩</div>";
 document.querySelectorAll(".pl").forEach(e=>e.onclick=()=>{AGENT=e.dataset.a;$("#agent").value=AGENT;WATCH=true;$("#ctl").hidden=true;status();players()})}
async function init(){const j=await (await fetch("/play/api/books",{headers:AUTH})).json();$("#book").innerHTML=j.books.filter(b=>b.playable!==false).map(b=>`<option value="${esc(b.slug)}">${esc(b.title||b.slug)}（${b.mode==="branch"?"有选项":"按卷"}）</option>`).join("");
 BOOK=new URLSearchParams(location.search).get("book")||$("#book").value;$("#book").value=BOOK;AGENT=$("#agent").value;status();players();setInterval(()=>{players();if(WATCH)status()},5000)}
$("#book").onchange=()=>{BOOK=$("#book").value;status();players()};
$("#me").onclick=()=>{AGENT=$("#agent").value.trim();WATCH=false;$("#ctl").hidden=false;status();players()};
$("#watch").onclick=()=>{AGENT=$("#agent").value.trim();WATCH=true;$("#ctl").hidden=true;status()};
$("#img").onchange=()=>vis((lines.at(-1)||{}).vis);init();
</script></body></html>
