# DeepSeek Harness（dsh）挂 galbook 的 MCP 服务。
# 用法 A（临时）：dsh headless --patch galbook.patch.yml "……"
# 用法 B（常驻）：把下面 insert 合进 $DSH_HOME/profiles/<profile>/cordis.patch.yml（或 $DSH_HOME/cordis.patch.yml）
# 改三处：command（Windows 一般是 python 或 py）、--books / --data 的绝对路径、cwd 指向 galbook 仓库（没 pip install 时需要）。
- insert:
    - id: mcp-galbook
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: galbook
        transport: stdio
        command: python3
        args: ['-m', 'galbook', 'mcp', '--books', '/path/to/books', '--data', '/path/to/play-data',
               '--book', 'fog-harbor', '--agent', 'dsh-agent', '--lang', 'zh']
        cwd: /path/to/galbook
        env:
          PYTHONPATH: /path/to/galbook
          PYTHONIOENCODING: utf-8
        toolCallTimeoutMs: 60000
